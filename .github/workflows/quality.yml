# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: Quality

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  composer-validate:
    name: Validate composer configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none
          tools: composer

      - name: Validate composer configuration
        run: composer validate --strict --quiet --no-interaction --no-check-all --no-check-lock

  coding-guidelines:
    name: Coding Guidelines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-phel

      - name: Run friendsofphp/php-cs-fixer
        run: ./vendor/bin/php-cs-fixer fix --allow-risky=yes --dry-run --show-progress=dots --using-cache=no --verbose

      - name: Run rector/rector
        run: ./vendor/bin/rector process --dry-run --config=rector.php

  phel-lint:
    name: Lint the Phel standard library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-phel

      # Phel's own stdlib must pass Phel's own linter. Exits non-zero only on
      # `error`-severity rules, so today's remaining warnings do not gate the
      # build while a regression to an error does.
      - name: Run phel lint on src/phel
        run: ./bin/phel lint --no-cache src/phel

  # `composer test-compiler:coverage` has always worked locally, but every CI job
  # installs PHP with `coverage: none`, so no figure was ever published and nothing
  # gated on one. This publishes it to the run summary and enforces a floor.
  #
  # COVERAGE_FLOOR is a ratchet: raise it when the real figure clears it
  # comfortably, never lower it to turn a red build green.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COVERAGE_FLOOR: '80'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-phel
        with:
          # pcov is several times faster than Xdebug for line coverage and is all
          # this job needs; nothing here steps or inspects.
          coverage: pcov

      - name: Run the compiler suites with coverage
        run: |
          php -d memory_limit=2G vendor/bin/phpunit \
            --testsuite=unit,integration \
            --coverage-clover=data/clover.xml \
            --do-not-cache-result

      - name: Publish the figure and enforce the floor
        run: php tools/check-coverage.php data/clover.xml "$COVERAGE_FLOOR"

  type-checker:
    name: Type Checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-phel

      - name: Run Psalm on internal code
        run: ./vendor/bin/psalm --config=psalm.xml --no-progress --shepherd --show-info=false --stats --php-version=8.4

      - name: Run PHPStan (level 9) on internal code
        run: ./vendor/bin/phpstan --memory-limit=516M --debug -vvv
