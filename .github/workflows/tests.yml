# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: Tests

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Linux and macOS are the "Supported" tier in docs/stability.md: a failure here
  # blocks a release. Every PHP minor runs on Linux; macOS runs the minimum only,
  # because what it is guarding is the platform (paths, tempdirs, ext availability)
  # rather than the language version.
  compiler-tests:
    name: Compiler tests on PHP ${{ matrix.php }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        php: [ '8.4', '8.5' ]
        include:
          - os: macos-latest
            php: '8.4'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-phel
        with:
          php-version: ${{ matrix.php }}

      - name: Run unit tests to the compiler itself
        run: vendor/bin/phpunit --testsuite unit

      - name: Run integration tests to the compiler itself
        run: composer run-script test-integration

  core-tests:
    name: Core tests on PHP ${{ matrix.php }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Fail fast instead of hanging ~6h if a worker stalls on OPcache startup lock.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        php: [ '8.4', '8.5' ]
        include:
          - os: macos-latest
            php: '8.4'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-phel
        with:
          php-version: ${{ matrix.php }}

      - name: Run tests to the core library
        run: composer run-script test-core

  # Windows is the "Best effort" tier in docs/stability.md: bugs are accepted and
  # fixed, but a Windows-only failure does not block a release, so this job reports
  # without gating. Promoting it to blocking means deleting `continue-on-error`,
  # which is a deliberate decision rather than something that happens by accident.
  #
  # It runs the compiler unit suite and the core library, the two that exercise the
  # path handling and temp-directory logic most likely to be platform-sensitive.
  windows-tests:
    name: Windows tests (best effort)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --no-ansi --no-progress

      - name: Run unit tests to the compiler itself
        run: vendor/bin/phpunit --testsuite unit

      - name: Run tests to the core library
        run: php -d memory_limit=256M bin/phel test

  bench-tests:
    name: Bench tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-phel

      - name: Run PHPBench
        run: vendor/bin/phpbench run --iterations=3 --warmup=1 --report=aggregate

  bash-tests:
    name: Bash tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-phel

      - name: Run Bashunit tests
        run: tools/bashunit tools/*-test.sh --simple

  # Only the version the lock file happens to resolve is covered by the other
  # jobs, so each end of the declared symfony/console range gets its own run: a
  # range we advertise but never install is a compatibility claim with nothing
  # behind it. `^6.0` and `^7.2` used to be declared and do not work: neither
  # has the `markdown` output style `phel\cli` renders with.
  symfony-console-compat:
    name: Compat tests on symfony/console ${{ matrix.console }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        console: [ '7.3.*', '^8.0' ]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-phel

      - name: Pin symfony/console to ${{ matrix.console }} for this run
        run: composer update --with "symfony/console:${{ matrix.console }}" --with-all-dependencies --no-interaction --no-ansi --no-progress

      - name: Show the resolved version
        run: composer show symfony/console | head -3

      - name: Run core tests
        run: composer run-script test-core

      - name: Run compiler integration tests
        run: php -d memory_limit=2G vendor/bin/phpunit --testsuite=integration
