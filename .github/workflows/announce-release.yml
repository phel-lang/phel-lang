name: Announce release draft

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.40.0)'
        required: true

permissions:
  contents: read

jobs:
  draft:
    # A pre-release keeps `## Unreleased`, so CHANGELOG.md has no section to
    # build a thread from.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Run unit tests
        run: node --test scripts/announce-release/*.test.mjs

      - name: Build thread draft
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node scripts/announce-release.mjs

      - name: Upload thread draft
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thread-${{ github.event.release.tag_name || inputs.tag }}
          path: |
            thread.md
            thread.json
          if-no-files-found: error
