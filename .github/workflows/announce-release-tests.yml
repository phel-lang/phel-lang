name: announce-release tests

on:
  pull_request:
    paths:
      - 'scripts/announce-release.mjs'
      - 'scripts/announce-release/**'
      - '.github/workflows/announce-release.yml'
      - '.github/workflows/announce-release-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/announce-release.mjs'
      - 'scripts/announce-release/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Run unit tests
        run: node --test scripts/announce-release/*.test.mjs
