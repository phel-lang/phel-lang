# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

# Mutation testing over the two places where a wrong test is worse than a missing
# one: the runtime data structures every Phel program depends on, and the analyzer
# that decides what those programs mean.
#
# Line coverage says a line ran. It does not say anything would have failed had
# that line been wrong. `Cons::walkTail()` passes the entire unit suite with its
# body disabled, and only `test-core` notices; a surviving mutant is how that
# becomes visible.
#
# Weekly rather than per-pull-request. A full run is minutes, and the finding it
# produces ("this test asserts nothing") is not the kind that needs to block a
# merge the hour it appears.

name: Mutation

on:
  schedule:
    - cron: '0 4 * * 1'
  pull_request:
    paths:
      - 'infection.json5'
      - '.github/workflows/mutation.yml'
  workflow_dispatch:
    inputs:
      min-msi:
        description: 'Override the MSI floor for this run'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  infection:
    name: Mutation testing (Lang + Analyzer)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Ratchets, like the coverage floor. Raise them when a run clears them
      # comfortably; never lower one to turn a red build green. MIN_COVERED_MSI
      # is the stricter of the two: it ignores code no test touches at all, so it
      # measures the quality of the tests that do exist.
      MIN_MSI: '0'
      MIN_COVERED_MSI: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          # Infection reads the diff to report which mutants a change introduced.
          fetch-depth: 0

      - uses: ./.github/actions/setup-phel
        with:
          # Infection needs a coverage driver; pcov is several times faster than
          # Xdebug and nothing here needs a step debugger.
          coverage: pcov

      # `--initial-tests-php-options` silences deprecation *display* for the
      # initial run only. The unit suite deliberately exercises Phel's own
      # deprecation channel, which writes `E_USER_DEPRECATED` to stderr; PHPUnit
      # exits 0, but Infection reads a non-empty stderr as a failed initial run
      # and refuses to start. Mutant runs are unaffected.
      - name: Run Infection
        run: |
          php -d memory_limit=2G vendor/bin/infection \
            --threads=max \
            --no-progress \
            --no-interaction \
            --initial-tests-php-options='-d error_reporting=6143' \
            --min-msi="${{ github.event.inputs.min-msi || env.MIN_MSI }}" \
            --min-covered-msi="$MIN_COVERED_MSI"

      - name: Publish the mutation summary
        if: always()
        run: |
          {
            echo '### Mutation testing'
            echo
            echo '```'
            cat data/infection-summary.log 2>/dev/null || echo 'No summary produced.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the full mutation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infection-log
          path: data/infection.log
          if-no-files-found: warn
          retention-days: 14
