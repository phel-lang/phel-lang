model_reasoning_effort = "medium"
# The deepest Compiler instruction chain exceeds the 32 KiB default; lint budgets it in agnostic-ai.yaml.
project_doc_max_bytes = 65536

developer_instructions = """
This is the Phel language repository. Treat AGENTS.md as the source of truth for repository policy. It is generated from .agnostic-ai/: change policy there and run `agnostic-ai sync`, never edit AGENTS.md. Before editing .agnostic-ai/, codex config or resources/agents/, read .agnostic-ai/rules/agent-tooling.md.

Use .codex/ for Codex-native mechanics only. Do not move Claude Code settings into .codex/.
The resources/agents/ tree is the downstream Phel user package installed into user projects as .agents/.
Never add a Co-authored-by trailer or a "Generated with" line to commits or pull requests.

Directory-scoped rules are emitted as nested AGENTS.md files under src/ and tests/ (src/php/<Module>/AGENTS.md, tests/php/AGENTS.md,
src/phel/AGENTS.md). Before editing a file, read every AGENTS.md on the path from the repository root to it.
"""

[features]
hooks = true
multi_agent = true

[agents]
max_threads = 6
max_depth = 1
job_max_runtime_seconds = 1800
