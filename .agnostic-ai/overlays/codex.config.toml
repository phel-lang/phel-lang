model_reasoning_effort = "medium"
# Allow nested module instructions within the chain budget in agnostic-ai.yaml.
project_doc_max_bytes = 65536

developer_instructions = """
Before editing a file, read every AGENTS.md from the repository root through its directory. Codex discovers nested instructions from the session launch directory, not from files you open.
"""

[features]
hooks = true
multi_agent = true

[agents]
max_threads = 6
max_depth = 1
job_max_runtime_seconds = 1800
