commit_attribution = ""
model_reasoning_effort = "medium"
# The Compiler module chain (root + src/php + src/php/Compiler AGENTS.md) is about 57 KB; the 32 KiB default truncates it.
project_doc_max_bytes = 65536

developer_instructions = """
This is the Phel language repository. Treat AGENTS.md as the source of truth for repository policy. It is generated from .agnostic-ai/: change policy there and run `agnostic-ai sync`, never edit AGENTS.md.

Use .codex/ for Codex-native mechanics only. Do not move Claude Code settings into .codex/.
The resources/agents/ tree is the downstream Phel user package installed into user projects as .agents/.

Directory-scoped rules are emitted as nested AGENTS.md files (src/php/<Module>/AGENTS.md, tests/php/Integration/AGENTS.md,
src/phel/AGENTS.md). Before editing a file, read every AGENTS.md on the path from the repository root to it.
"""

[features]
hooks = true
multi_agent = true

[agents]
max_threads = 6
max_depth = 1
job_max_runtime_seconds = 1800
