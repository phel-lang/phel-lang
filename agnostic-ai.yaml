# yaml-language-server: $schema=https://raw.githubusercontent.com/Chemaclass/agnostic-ai/v0.90.0/docs/schemas/config.schema.json
version: 1

requires: "0.90.0"

sources:
  agents: .agnostic-ai/agents
  skills: .agnostic-ai/skills
  rules: .agnostic-ai/rules
  hooks: .agnostic-ai/hooks
  settings: .agnostic-ai/settings

targets:
  - claude
  - codex

on-unsupported: error

models:
  strong: {claude: opus, codex: gpt-6.1-sol, effort: high}
  balanced: {claude: sonnet, codex: gpt-6.1-sol, effort: medium}
  fast: {claude: haiku, codex: gpt-6-luna, effort: low}

coverage:
  accept:
    - target: codex
      kind: agents
      field: maxTurns
      reason: Codex has no per-agent turn cap; the parent assigns the task and validation budget.
    - target: codex
      kind: agents
      field: can
      reason: Codex cannot enforce per-agent tool allowlists; shared instructions define the task limits within the session sandbox.
    - target: codex
      kind: skills
      field: allowed-tools
      reason: Codex cannot enforce skill tool grants; it uses session permissions and the shared procedure.
    - target: codex
      kind: skills
      field: argument-hint
      reason: Only Claude Code shows the hint; Codex skills read the request text.
    - target: codex
      kind: skills
      field: context
      reason: refactor-check forks into Claude's Explore agent; in Codex it runs inline, read-only by its instructions.
    - target: codex
      kind: skills
      field: agent
      reason: Same as context; Codex has no skill-level agent.

sync:
  collision-policy: fail

lint:
  # Keep startup policy concise; command details live in the test skill.
  instructions-words: 1000
  # Codex truncates past project_doc_max_bytes (65536, .agnostic-ai/overlays/codex.config.toml).
  # Warn before scoped instructions approach the configured limit.
  codex-chain-bytes: 40960
